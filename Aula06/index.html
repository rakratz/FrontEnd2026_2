<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Recursivo</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <!-- Painel da Direita: Formulário de Login -->
    <div class="login-form">
        <h2>Entrar na conta</h2>
        <p class="subtitle">Use seu e-mail institucional e senha para logar.</p>

        <!-- Formulário de Login -->
        <!-- Toda a Validação vai ser feita em JavaScript -->
        <form id="form-login" novalidate>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu.email@dominio.com"/>
                <!-- Incluir um campo para erro no e-mail-->
                <small class="error" id="error-email"></small>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha segura" />
                <!-- Incluir um campo para erro na senha-->
                <small class="error" id="error-password"></small>
            </div>

            <div class="password-hints">
                <span>Mín. 8 caracteres</span>
                <span>Letra maúscula</span>
                <span>Número</span>
            </div>

            <div class="form-extra">
                <label class="remember-me">
                    <input type="checkbox" id="remember" /> Lembrar de mim
                </label>
                <a href="#" class="forgot-link">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-login">Entrar</button>

            <!-- Resultado se o Login foi com sucesso -->
            <div id="result-message"></div>
        </form>

    </div>

</body>
</html>
