<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entrar no Sistema de Login</title>
        <!-- 
            Bloco de Comentário em HTML
            Commun inclir o Link para o arquivo CSS externo
            E o Script JavaScript externo, se necessário
         -->
            <link rel="stylesheet" href="css/style.css">
            <script script src="js/script.js"></script>
    </head>
    
    <body>
        <main class="cartao">

            <header>
                <h1>Entrar</h1>
                <p class="descricao">Digite seu usuário e sua senha para acessar.</p>
            </header>

            <form id="form-login">
                <!-- Usuário -->
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                </div>
                <button type="submit">Entrar</button>
                
                <!-- Mensagem com o Status do Loign --> 
                <p id="mensagem-login" class="mensagem" role="status"></p>
            </form>

            <footer>
                <a href="recuperar.html">Esqueci minha senha</a>
            </footer>
        </main>

    </body>

</html>
